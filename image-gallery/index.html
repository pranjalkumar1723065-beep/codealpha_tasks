
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Gallery | Pranjal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="#" class="logo">
      <span class="camera">📸</span>
      <span>My <span class="purple">Gallery</span>
        <small>Beautiful moments, captured</small>
      </span>
    </a>

    <nav>
      <a href="#home">Home</a>
      <a href="#gallery">Gallery</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main id="home">
    <section class="hero">
      <h1>Explore <span class="purple">My Gallery</span></h1>
      <p>Nature, cities, people and more — all in one place.</p>
    </section>

    <section id="gallery" class="gallery-section">
      <div class="filters" aria-label="Filter images">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="nature">Nature</button>
        <button class="filter-btn" data-category="cities">Cities</button>
        <button class="filter-btn" data-category="people">People</button>
        <button class="filter-btn" data-category="animals">Animals</button>
      </div>

      <div class="gallery-grid" id="galleryGrid"></div>
      <p id="emptyMessage" hidden>No images in this category.</p>
    </section>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox"
       role="dialog" aria-modal="true"
       aria-label="Image viewer" aria-hidden="true">

    <div class="lightbox-panel">
      <div class="lightbox-top">
        <span id="imageCounter">1 / 8</span>
        <button class="close-btn" id="closeBtn"
                aria-label="Close image viewer">&times;</button>
      </div>

      <div class="lightbox-image-wrap">
        <button class="nav-btn prev-btn" id="prevBtn"
                aria-label="Previous image">&#10094;</button>
        <img id="lightboxImage" src="" alt="">
        <button class="nav-btn next-btn" id="nextBtn"
                aria-label="Next image">&#10095;</button>
      </div>

      <h2 id="imageTitle"></h2>
      <p id="imageDescription"></p>
      <div class="lightbox-thumbnails" id="thumbnails"></div>
    </div>
  </div>

  <footer id="about">
    Made with <span class="purple">♥</span> by Pranjal
  </footer>

  <script src="script.js"></script>
</body>
</html>
